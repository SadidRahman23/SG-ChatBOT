<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing in — SG ChatBOT</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #0b0f17;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e4ecf7;
    }
    .card {
      text-align: center;
      padding: 48px 40px;
      background: #131929;
      border: 1px solid #1e2a3d;
      border-radius: 20px;
      max-width: 380px; width: 90%;
    }
    .logo { font-size: 36px; margin-bottom: 20px; }
    .title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .sub { font-size: 14px; color: #5a7a99; margin-bottom: 28px; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #1e2a3d;
      border-top-color: #6c8eff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 13px; color: #8a9bb5; }
    .error-box {
      display: none;
      background: rgba(248,113,113,.08);
      border: 1px solid rgba(248,113,113,.25);
      border-radius: 10px;
      padding: 16px;
      font-size: 13px;
      color: #f87171;
      margin-top: 20px;
    }
    .retry-link {
      display: inline-block;
      margin-top: 16px;
      color: #6c8eff;
      font-size: 13px;
      text-decoration: none;
    }
    .retry-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">✦</div>
    <div class="title">Signing you in…</div>
    <div class="sub">Just a moment while we verify your account.</div>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">Processing…</div>
    <div class="error-box" id="errorBox">
      <span id="errorMsg">Something went wrong. Please try again.</span>
      <br>
      <a href="chat.html" class="retry-link">← Back to login</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');
    const error  = params.get('error');

    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status').style.display = 'none';
      document.getElementById('errorMsg').textContent = msg || 'Something went wrong. Please try again.';
      document.getElementById('errorBox').style.display = 'block';
    }

    // Map known backend error codes to friendly messages
    const ERROR_MESSAGES = {
      oauth_failed:        'OAuth sign-in failed. Please try again.',
      google_oauth_failed: 'Could not sign in with Google. Please try again.',
      github_oauth_failed: 'Could not sign in with GitHub. Please try again.',
    };

    if (error) {
      showError(ERROR_MESSAGES[error] || 'Sign-in was cancelled or failed. Please try again.');
    } else if (!token) {
      showError('No authentication token received. Please try signing in again.');
    } else {
      document.getElementById('status').textContent = 'Saving your session…';
      // Store using the same keys chat.html uses
      localStorage.setItem('sg_token', token);
      document.getElementById('status').textContent = 'Redirecting to chat…';
      // Small delay so the user sees the "success" state before being whisked away
      setTimeout(() => { window.location.replace('chat.html'); }, 600);
    }
  </script>
</body>
</html>
