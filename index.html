<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SG ChatBOT | AI Assistant</title>
  <meta name="description" content="Chat with SG AI — powered by DeepSeek. Ask questions, analyze images, get code help instantly.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://sg-chatbot-a2h.pages.dev/chat.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg:          #05070b;
      --surface:     #0b0f17;
      --surface-2:   #111827;
      --surface-3:   #1a2336;
      --border:      rgba(255,255,255,0.06);
      --border-2:    rgba(255,255,255,0.11);
      --text:        #e4ecf7;
      --muted:       #4a5a72;
      --dim:         #8a9bb5;
      --accent:      #4f8eff;
      --accent2:     #00d4aa;
      --glow:        rgba(79,142,255,0.15);
      --red:         rgba(255,80,80,0.8);
      --font:        'Cabinet Grotesk', sans-serif;
      --r-sm:        8px;
      --r-md:        14px;
      --r-lg:        20px;
      --r-xl:        26px;
      --sidebar-w:   260px;
      --topbar-h:    58px;
      --anim:        0.2s cubic-bezier(0.4,0,0.2,1);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      overflow: hidden;
    }

    /* subtle grid */
    body::after {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background-image:
        linear-gradient(rgba(79,142,255,0.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(79,142,255,0.04) 1px,transparent 1px);
      background-size:56px 56px;
    }

    /* ══ SIDEBAR ══ */
    .sidebar {
      width: var(--sidebar-w); position:relative; z-index:10; flex-shrink:0;
      background: var(--surface); border-right:1px solid var(--border);
      display:flex; flex-direction:column; padding:18px 14px; gap:5px;
      transition: transform var(--anim);
    }
    .logo {
      display:flex; align-items:center; gap:10px;
      padding:6px 8px 16px;
      font-size:18px; font-weight:800; letter-spacing:-0.5px;
    }
    .logo-text {
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .logo-back {
      margin-left:auto; width:28px; height:28px; border-radius:7px;
      background:transparent; border:1px solid var(--border-2);
      color:var(--dim); cursor:pointer; display:flex; align-items:center; justify-content:center;
      font-size:13px; transition:all var(--anim); text-decoration:none;
    }
    .logo-back:hover { background:var(--surface-2); color:var(--text); }

    .sidebar-close-btn {
      display:none; position:absolute; top:16px; right:14px;
      background:var(--surface-2); border:1px solid var(--border-2);
      color:var(--dim); border-radius:var(--r-sm);
      width:30px; height:30px; align-items:center; justify-content:center;
      cursor:pointer; font-size:16px; transition:background var(--anim);
    }
    .sidebar-close-btn:hover { background:var(--surface-3); color:var(--text); }

    .new-chat-btn {
      display:flex; align-items:center; gap:9px;
      padding:10px 13px; border-radius:var(--r-md);
      border:1px solid var(--border-2); background:var(--surface-2);
      color:var(--text); font-family:var(--font);
      font-size:13px; font-weight:600; cursor:pointer;
      transition:all var(--anim); text-align:left; width:100%; margin-bottom:6px;
    }
    .new-chat-btn:hover { background:var(--surface-3); border-color:var(--accent); box-shadow:0 0 0 3px var(--glow); }

    .sidebar-label { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:10px 8px 5px; }
    .history-list  { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
    .history-list::-webkit-scrollbar { width:0; }
    .history-item  { padding:8px 11px; border-radius:var(--r-sm); font-size:13px; color:var(--dim); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:all var(--anim); }
    .history-item:hover  { background:var(--surface-2); color:var(--text); }
    .history-item.active { background:var(--surface-3); color:var(--text); }

    .sidebar-footer { border-top:1px solid var(--border); padding-top:12px; }
    .sidebar-user   { display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:var(--r-md); cursor:pointer; transition:background var(--anim); }
    .sidebar-user:hover { background:var(--surface-2); }
    .avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,rgba(79,142,255,.3),rgba(0,212,170,.2)); border:1px solid var(--border-2); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--accent); flex-shrink:0; }
    .user-info  { flex:1; min-width:0; }
    .user-name  { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .user-role  { font-size:11px; color:var(--muted); }

    .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:9; backdrop-filter:blur(4px); }
    .sidebar-overlay.active { display:block; }

    /* ══ MAIN ══ */
    .main { flex:1; display:flex; flex-direction:column; position:relative; z-index:1; min-width:0; }

    .topbar {
      display:flex; align-items:center; justify-content:space-between;
      padding:0 20px; height:var(--topbar-h);
      background:rgba(5,7,11,0.75); backdrop-filter:blur(20px);
      border-bottom:1px solid var(--border);
      position:relative; z-index:5; flex-shrink:0; gap:10px;
    }
    .hamburger { display:none; background:transparent; border:1px solid var(--border-2); border-radius:var(--r-sm); color:var(--dim); width:36px; height:36px; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:background var(--anim); }
    .hamburger:hover { background:var(--surface-2); color:var(--text); }
    .hamburger svg { width:17px; height:17px; }

    .model-badge { display:flex; align-items:center; gap:7px; padding:5px 12px; border-radius:99px; background:var(--surface-2); border:1px solid var(--border); font-size:11.5px; color:var(--dim); font-weight:600; white-space:nowrap; flex-shrink:0; letter-spacing:.02em; }
    .model-badge .dot { width:6px; height:6px; border-radius:50%; background:var(--accent2); box-shadow:0 0 7px var(--accent2); animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .topbar-right { display:flex; align-items:center; gap:8px; margin-left:auto; }
    .btn-ghost    { padding:6px 13px; border-radius:var(--r-sm); border:1px solid var(--border-2); background:transparent; color:var(--dim); font-family:var(--font); font-size:12.5px; cursor:pointer; transition:all var(--anim); white-space:nowrap; }
    .btn-ghost:hover { background:var(--surface-2); color:var(--text); border-color:rgba(255,255,255,.18); }
    .btn-primary  { padding:6px 15px; border-radius:var(--r-sm); border:none; background:var(--accent); color:#fff; font-family:var(--font); font-size:12.5px; font-weight:600; cursor:pointer; transition:all var(--anim); white-space:nowrap; }
    .btn-primary:hover { filter:brightness(1.15); box-shadow:0 0 0 3px var(--glow); }

    /* ══ CHAT ══ */
    #chat { flex:1; overflow-y:auto; padding:24px 0 8px; display:flex; flex-direction:column; gap:4px; scroll-behavior:smooth; }
    #chat::-webkit-scrollbar { width:4px; }
    #chat::-webkit-scrollbar-track { background:transparent; }
    #chat::-webkit-scrollbar-thumb { background:var(--surface-3); border-radius:99px; }

    /* ── WELCOME ── */
    .welcome { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:40px 20px; animation:fadeUp .5s ease; }
    .welcome-icon { width:64px; height:64px; border-radius:20px; background:linear-gradient(135deg,rgba(79,142,255,.2),rgba(0,212,170,.12)); border:1px solid var(--border-2); display:flex; align-items:center; justify-content:center; font-size:28px; margin-bottom:4px; box-shadow:0 0 40px rgba(79,142,255,.15); }
    .welcome h1 { font-size:clamp(20px,3vw,26px); font-weight:800; letter-spacing:-.5px; text-align:center; }
    .welcome p  { font-size:14.5px; color:var(--dim); text-align:center; }

    .suggestion-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:16px; max-width:480px; width:100%; }
    .suggestion-card { padding:13px 15px; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface); cursor:pointer; font-size:13px; color:var(--dim); line-height:1.5; transition:all var(--anim); text-align:left; }
    .suggestion-card:hover { border-color:var(--accent); background:var(--surface-2); color:var(--text); box-shadow:0 0 0 3px var(--glow); }
    .suggestion-card strong { display:block; color:var(--text); font-size:13px; margin-bottom:2px; font-weight:600; }

    /* ── MESSAGES ── */
    .msg-row { display:flex; padding:4px 24px; gap:11px; animation:fadeUp .18s ease; }
    .msg-row.user { justify-content:flex-end; }
    .msg-row.bot  { justify-content:flex-start; }

    .bot-avatar-wrap { position:relative; width:32px; height:32px; flex-shrink:0; margin-top:3px; }
    .bot-avatar-bg   { width:32px; height:32px; border-radius:10px; background:linear-gradient(135deg,rgba(79,142,255,.25),rgba(0,212,170,.15)); border:1px solid var(--border-2); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:var(--accent); position:relative; z-index:2; transition:border-radius .4s cubic-bezier(.4,0,.2,1); }
    .bot-avatar-ring { position:absolute; inset:-3px; border-radius:13px; z-index:1; opacity:0; transition:opacity .3s,border-radius .4s cubic-bezier(.4,0,.2,1); background:conic-gradient(from 0deg,#4f8eff,#00d4aa 90deg,#a855f7 180deg,#ff6b6b 270deg,#4f8eff); -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0); -webkit-mask-composite:xor; mask-composite:exclude; padding:2px; }
    .bot-avatar-wrap.thinking .bot-avatar-bg   { border-radius:50%; }
    .bot-avatar-wrap.thinking .bot-avatar-ring { border-radius:50%; opacity:1; animation:spin 1.2s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }

    .bubble { max-width:min(600px,80%); padding:12px 16px; border-radius:var(--r-lg); font-size:14.5px; line-height:1.72; word-break:break-word; }
    .msg-row.user .bubble { background:var(--accent); color:#fff; border-bottom-right-radius:5px; box-shadow:0 4px 18px rgba(79,142,255,.22); }
    .msg-row.bot  .bubble { background:var(--surface-2); border:1px solid var(--border); border-bottom-left-radius:5px; }
    .bubble p { margin-bottom:10px; } .bubble p:last-child { margin-bottom:0; }
    .bubble code { background:rgba(79,142,255,.12); color:var(--accent); padding:1px 5px; border-radius:4px; font-size:12.5px; }
    .bubble pre  { background:var(--surface-3); border:1px solid var(--border-2); border-radius:var(--r-sm); padding:13px; overflow-x:auto; margin:10px 0; position:relative; }
    .bubble pre code { background:none; padding:0; color:var(--text); font-size:12.5px; }
    .bubble strong { color:#fff; font-weight:700; }
    .bubble ul,.bubble ol { padding-left:20px; margin-bottom:10px; }
    .bubble li { margin-bottom:3px; }
    .bubble h1,.bubble h2,.bubble h3 { font-weight:700; margin:14px 0 6px; }

    /* copy btn on code blocks */
    .bubble pre .copy-btn {
      position:absolute; top:8px; right:8px;
      padding:3px 9px; border-radius:6px; border:1px solid var(--border-2);
      background:var(--surface); color:var(--dim); font-family:var(--font);
      font-size:11px; cursor:pointer; opacity:0; transition:all var(--anim);
    }
    .bubble pre:hover .copy-btn { opacity:1; }
    .bubble pre .copy-btn:hover { background:var(--surface-3); color:var(--text); }

    /* ── FILE PREVIEWS ── */
    .msg-file-preview { max-width:min(500px,80%); border-radius:var(--r-lg); overflow:hidden; border:1px solid var(--border-2); }
    .msg-file-preview img { width:100%; max-height:260px; object-fit:cover; display:block; }
    .msg-doc-preview  { display:flex; align-items:center; gap:11px; padding:12px 15px; background:var(--surface-2); border-radius:var(--r-lg); border:1px solid var(--border-2); max-width:min(340px,80%); }
    .doc-icon  { width:38px; height:38px; border-radius:9px; background:linear-gradient(135deg,rgba(79,142,255,.18),rgba(0,212,170,.12)); border:1px solid var(--border-2); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:17px; }
    .doc-info  { flex:1; min-width:0; }
    .doc-name  { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .doc-size  { font-size:11px; color:var(--muted); margin-top:2px; }

    /* ── FILE PREVIEW BAR ── */
    .file-preview-bar { display:none; margin:0 16px 8px; padding:9px 13px; background:var(--surface-2); border:1px solid var(--border-2); border-radius:var(--r-md); align-items:center; gap:11px; animation:fadeUp .2s ease; max-width:700px; margin-left:auto; margin-right:auto; }
    .file-preview-bar.visible { display:flex; }
    .file-preview-thumb    { width:42px; height:42px; border-radius:8px; object-fit:cover; flex-shrink:0; border:1px solid var(--border-2); }
    .file-preview-doc-icon { width:42px; height:42px; border-radius:8px; background:linear-gradient(135deg,rgba(79,142,255,.18),rgba(0,212,170,.12)); border:1px solid var(--border-2); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
    .file-preview-info { flex:1; min-width:0; }
    .file-preview-name { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .file-preview-meta { font-size:11px; color:var(--muted); margin-top:2px; }
    .file-preview-remove { width:26px; height:26px; border-radius:7px; background:transparent; border:1px solid var(--border-2); color:var(--dim); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; transition:all var(--anim); }
    .file-preview-remove:hover { background:rgba(255,80,80,.1); border-color:rgba(255,80,80,.3); color:#ff8080; }

    /* ── TYPING ── */
    .typing-indicator { display:flex; align-items:center; gap:6px; padding:4px 2px; }

    /* Glowing bar animation */
    .typing-bar {
      width: 3px; border-radius: 99px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      box-shadow: 0 0 6px var(--accent);
      animation: barPulse 1s ease-in-out infinite;
    }
    .typing-bar:nth-child(1) { height:14px; animation-delay:0s; }
    .typing-bar:nth-child(2) { height:22px; animation-delay:.12s; }
    .typing-bar:nth-child(3) { height:18px; animation-delay:.24s; }
    .typing-bar:nth-child(4) { height:26px; animation-delay:.36s; }
    .typing-bar:nth-child(5) { height:14px; animation-delay:.48s; }

    @keyframes barPulse {
      0%,100% { transform:scaleY(.4); opacity:.4; }
      50%      { transform:scaleY(1);  opacity:1;  }
    }

    .typing-label {
      font-size:12px; color:var(--accent); font-weight:600;
      letter-spacing:.04em;
      animation: labelFade 1.5s ease-in-out infinite;
    }
    @keyframes labelFade { 0%,100%{opacity:.5} 50%{opacity:1} }

    /* ── TYPEWRITER CURSOR ── */
    .typewriter-cursor {
      display: inline-block;
      width: 2px; height: 1em;
      background: var(--accent);
      border-radius: 2px;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: cursorBlink .6s ease-in-out infinite;
    }
    @keyframes cursorBlink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── MESSAGE ACTIONS ── */
    .msg-actions {
      display: flex; align-items: center; gap: 4px;
      margin-top: 6px; margin-left: 43px;
      opacity: 0; transition: opacity var(--anim);
    }
    .msg-row.bot:hover .msg-actions { opacity: 1; }
    .msg-action-btn {
      width: 28px; height: 28px; border-radius: 7px;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--anim); flex-shrink: 0;
    }
    .msg-action-btn:hover { background: var(--surface-2); border-color: var(--border-2); color: var(--text); }
    .msg-action-btn.liked    { color: #4ade80; border-color: rgba(74,222,128,.3); background: rgba(74,222,128,.07); }
    .msg-action-btn.disliked { color: #f87171; border-color: rgba(248,113,113,.3); background: rgba(248,113,113,.07); }
    .msg-action-btn.copied   { color: var(--accent2); border-color: rgba(0,212,170,.3); background: rgba(0,212,170,.07); }
    .msg-action-btn svg { width: 13px; height: 13px; }
    .input-area { padding:8px 16px 16px; flex-shrink:0; padding-bottom:max(16px,env(safe-area-inset-bottom)); }
    .input-wrap  { max-width:700px; margin:0 auto; background:var(--surface); border:1px solid var(--border-2); border-radius:var(--r-xl); padding:10px 10px 10px 15px; display:flex; align-items:flex-end; gap:8px; transition:border-color var(--anim),box-shadow var(--anim); }
    .input-wrap:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--glow); }
    #input { flex:1; background:transparent; border:none; outline:none; color:var(--text); font-family:var(--font); font-size:14.5px; line-height:1.6; resize:none; max-height:140px; padding:3px 0; }
    #input::placeholder { color:var(--muted); }

    .upload-btn { width:35px; height:35px; border-radius:9px; border:1px solid var(--border-2); background:var(--surface-2); color:var(--dim); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all var(--anim); }
    .upload-btn:hover { background:var(--surface-3); border-color:var(--accent); color:var(--accent); }
    .upload-btn.has-file { border-color:var(--accent2); color:var(--accent2); background:rgba(0,212,170,.08); }
    .upload-btn svg { width:15px; height:15px; }
    #fileInput { display:none; }

    .send-btn { width:36px; height:36px; border-radius:10px; border:none; background:var(--accent); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .3s, box-shadow .3s, transform .15s; position:relative; overflow:hidden; }
    .send-btn:hover  { filter:brightness(1.18); transform:scale(1.06); }
    .send-btn:active { transform:scale(.94); }
    .send-btn .send-icon { width:16px; height:16px; display:block; transition:all .2s; }
    .send-btn .stop-icon {
      width:11px; height:11px;
      background:#fff; border-radius:2px;
      display:none; flex-shrink:0;
    }

    /* Loading/stop state */
    .send-btn.loading {
      cursor: default;
      animation: sendPulse 1s ease-in-out infinite;
    }
    .send-btn.loading:hover { filter:none; transform:none; }
    .send-btn.loading .stop-icon { display:block; }
    .send-btn.loading .send-icon { display:none; }

    @keyframes sendPulse {
      0%   { box-shadow: 0 0 0 0   rgba(79,142,255,0.8); }
      70%  { box-shadow: 0 0 0 10px rgba(79,142,255,0);  }
      100% { box-shadow: 0 0 0 0   rgba(79,142,255,0);   }
    }

    .input-hint { text-align:center; font-size:11px; color:var(--muted); margin-top:7px; }

    /* ══ TOAST ══ */
    .toast { position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--surface-3); border:1px solid var(--border-2); color:var(--text); font-size:13px; padding:9px 18px; border-radius:99px; opacity:0; transition:all .3s; pointer-events:none; z-index:200; white-space:nowrap; }
    .toast.show    { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.error   { border-color:rgba(255,100,100,.4); color:#ff8080; }
    .toast.success { border-color:rgba(0,212,170,.4);   color:var(--accent2); }

    /* ══ MODAL ══ */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.75); backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center; z-index:100; padding:16px; }
    .modal-overlay.open { display:flex; }
    .modal-card { background:var(--surface); border:1px solid var(--border-2); border-radius:var(--r-xl); padding:28px 24px; width:100%; max-width:370px; display:flex; flex-direction:column; gap:13px; animation:scaleIn .22s cubic-bezier(.34,1.56,.64,1); box-shadow:0 30px 80px rgba(0,0,0,.55); }
    .modal-title    { font-size:20px; font-weight:800; margin-bottom:1px; }
    .modal-subtitle { font-size:13px; color:var(--muted); }
    .tab-row   { display:flex; background:var(--surface-2); border-radius:var(--r-sm); padding:3px; gap:3px; }
    .tab-btn   { flex:1; padding:7px; border-radius:6px; border:none; background:transparent; color:var(--dim); font-family:var(--font); font-size:13px; font-weight:500; cursor:pointer; transition:all var(--anim); }
    .tab-btn.active { background:var(--surface-3); color:var(--text); }
    .field-label { font-size:12px; font-weight:600; color:var(--dim); margin-bottom:4px; }
    .field-group { display:flex; flex-direction:column; gap:4px; }
    .modal-input { width:100%; padding:10px 13px; border-radius:var(--r-md); border:1px solid var(--border-2); background:var(--surface-2); color:var(--text); font-family:var(--font); font-size:14px; outline:none; transition:border-color var(--anim),box-shadow var(--anim); }
    .modal-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--glow); }
    .btn-full   { width:100%; padding:12px; border-radius:var(--r-md); border:none; background:var(--accent); color:#fff; font-family:var(--font); font-size:14px; font-weight:600; cursor:pointer; transition:all var(--anim); }
    .btn-full:hover { filter:brightness(1.12); }
    .btn-full:disabled { opacity:.55; cursor:not-allowed; }
    .btn-cancel { width:100%; padding:10px; border-radius:var(--r-md); border:1px solid var(--border); background:transparent; color:var(--dim); font-family:var(--font); font-size:13px; cursor:pointer; transition:all var(--anim); }
    .btn-cancel:hover { background:var(--surface-2); color:var(--text); }
    .modal-error { font-size:12.5px; color:#ff8080; background:rgba(255,100,100,.07); border:1px solid rgba(255,100,100,.2); border-radius:var(--r-sm); padding:8px 11px; display:none; }
    .modal-error.show { display:block; }

    @keyframes fadeUp  { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:translateY(0)} }
    @keyframes scaleIn { from{opacity:0;transform:scale(.92)} to{opacity:1;transform:scale(1)} }
    * { scrollbar-width:thin; scrollbar-color:var(--surface-3) transparent; }

    /* ══ MOBILE ══ */
    @media (max-width:768px) {
      :root { --sidebar-w:280px; }
      .sidebar { position:fixed; top:0; left:0; bottom:0; transform:translateX(-100%); z-index:20; box-shadow:4px 0 40px rgba(0,0,0,.4); }
      .sidebar.open { transform:translateX(0); }
      .sidebar-close-btn { display:flex; }
      .hamburger { display:flex; }
      .topbar { padding:0 14px; }
      .btn-ghost { display:none; }
      .msg-row { padding:4px 12px; gap:8px; }
      .bubble { max-width:88%; font-size:14px; padding:10px 13px; }
      .msg-file-preview { max-width:88%; }
      .msg-doc-preview  { max-width:88%; }
      .welcome { padding:24px 16px; }
      .suggestion-grid { grid-template-columns:1fr; max-width:320px; }
      .input-area { padding:8px 12px; padding-bottom:max(12px,env(safe-area-inset-bottom)); }
      .input-wrap { border-radius:18px; padding:8px 8px 8px 13px; }
      .input-hint { display:none; }
      .file-preview-bar { margin:0 12px 8px; }
    }
    @media (max-width:360px) {
      .bubble { max-width:92%; font-size:13.5px; }
    }
  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="sidebar" id="sidebar">
  <button class="sidebar-close-btn" id="sidebarCloseBtn">&#x2715;</button>
  <div class="logo">
    <span class="logo-text">SG ChatBOT</span>
    <a href="index.html" class="logo-back" title="Home">⌂</a>
  </div>

  <button class="new-chat-btn" id="newChatBtn"><span>＋</span> New conversation</button>
  <div class="sidebar-label">Recent</div>
  <div class="history-list" id="history"></div>

  <div class="sidebar-footer">
    <div class="sidebar-user" id="sidebarUserBtn">
      <div class="avatar" id="avatarEl">SG</div>
      <div class="user-info">
        <div class="user-name" id="userNameEl">Guest User</div>
        <div class="user-role" id="userRoleEl">Click to sign in</div>
      </div>
    </div>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <button class="hamburger" id="hamburgerBtn" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="model-badge"><span class="dot"></span>SG ONLINE</div>
    <div class="topbar-right">
      <button class="btn-ghost" id="clearBtn">Clear chat</button>
      <button class="btn-primary" id="topAuthBtn">Sign in</button>
    </div>
  </header>

  <div id="chat">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">✦</div>
      <h1>How can I help you?</h1>
      <p>Ask anything — powered by SG AI</p>
      <div class="suggestion-grid">
        <button class="suggestion-card" data-prompt="Explain quantum computing in simple terms"><strong>Explain a concept</strong>Quantum computing, simplified</button>
        <button class="suggestion-card" data-prompt="Write a Python function to sort a list of dictionaries by a key"><strong>Write some code</strong>Sort a list in Python</button>
        <button class="suggestion-card" data-prompt="What are the best productivity habits for developers?"><strong>Give me advice</strong>Developer productivity tips</button>
        <button class="suggestion-card" data-prompt="Summarize the key differences between REST and GraphQL"><strong>Compare ideas</strong>REST vs. GraphQL</button>
      </div>
    </div>
  </div>

  <!-- File preview bar -->
  <div class="file-preview-bar" id="filePreviewBar">
    <div id="filePreviewThumb"></div>
    <div class="file-preview-info">
      <div class="file-preview-name" id="filePreviewName"></div>
      <div class="file-preview-meta" id="filePreviewMeta"></div>
    </div>
    <button class="file-preview-remove" id="fileRemoveBtn" title="Remove">&#x2715;</button>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.txt,.csv,.xlsx,.xls">
      <button class="upload-btn" id="uploadBtn" title="Attach file" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <textarea id="input" placeholder="Message SG ChatBOT…" rows="1"></textarea>
      <button class="send-btn" id="sendBtn" aria-label="Send">
        <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/>
        </svg>
        <div class="stop-icon"></div>
      </button>
    </div>
    <p class="input-hint">SG is AI and can make mistakes.</p>
  </div>
</main>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal-card">
    <div>
      <div class="modal-title" id="modalTitle">Welcome back</div>
      <div class="modal-subtitle" id="modalSubtitle">Sign in to chat with SG AI</div>
    </div>
    <div class="tab-row">
      <button class="tab-btn active" id="tabLogin">Sign in</button>
      <button class="tab-btn"        id="tabSignup">Create account</button>
    </div>
    <div class="field-group">
      <div class="field-label">Email</div>
      <input class="modal-input" id="emailInput" type="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field-group">
      <div class="field-label">Password</div>
      <input class="modal-input" id="passwordInput" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="modal-error" id="modalError"></div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:2px;">
      <button class="btn-full"   id="submitBtn">Sign in</button>
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ✅ UPDATE THIS to your real Cloudflare backend URL (or Render URL)
  const API = 'https://sg-chatbot-z8hp.onrender.com';

  const TRIGGERS = {
    name:  ['tumar nam ki','your name','tomar nam','ki tomar nam'],
    owner: ['owner','malik','creator','who made you','ke baniyeche'],
  };
  const TRIGGER_REPLIES = {
    name:  'I am **SG ChatBOT**, your advanced AI assistant.',
    owner: '**Mohammed Sadid Rahman** is the creator and owner of SG ChatBOT.',
  };

  const STATE = {
    token: localStorage.getItem('sg_token') || null,
    email: localStorage.getItem('sg_email') || null,
    memory: [],
    isLogin: true,
    welcomeVisible: true,
    pendingFile: null,
    historyAdded: false, // ✅ প্রতি conversation-এ মাত্র একবার history-তে যাবে
  };

  const chatEl          = document.getElementById('chat');
  const inputEl         = document.getElementById('input');
  const modal           = document.getElementById('modal');
  const emailInput      = document.getElementById('emailInput');
  const passwordInput   = document.getElementById('passwordInput');
  const submitBtn       = document.getElementById('submitBtn');
  const modalError      = document.getElementById('modalError');
  const topAuthBtn      = document.getElementById('topAuthBtn');
  const userNameEl      = document.getElementById('userNameEl');
  const userRoleEl      = document.getElementById('userRoleEl');
  const avatarEl        = document.getElementById('avatarEl');
  const toastEl         = document.getElementById('toast');
  const sidebar         = document.getElementById('sidebar');
  const sidebarOverlay  = document.getElementById('sidebarOverlay');
  const fileInput       = document.getElementById('fileInput');
  const uploadBtn       = document.getElementById('uploadBtn');
  const filePreviewBar  = document.getElementById('filePreviewBar');
  const filePreviewName = document.getElementById('filePreviewName');
  const filePreviewMeta = document.getElementById('filePreviewMeta');
  const filePreviewThumb= document.getElementById('filePreviewThumb');
  const fileRemoveBtn   = document.getElementById('fileRemoveBtn');

  /* ── SIDEBAR ── */
  function openSidebar()  { sidebar.classList.add('open');  sidebarOverlay.classList.add('active');    document.body.style.overflow='hidden'; }
  function closeSidebar() { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); document.body.style.overflow=''; }
  document.getElementById('hamburgerBtn').addEventListener('click', openSidebar);
  document.getElementById('sidebarCloseBtn').addEventListener('click', closeSidebar);
  sidebarOverlay.addEventListener('click', closeSidebar);
  document.getElementById('newChatBtn').addEventListener('click', () => { clearChat(); if (window.innerWidth<=768) closeSidebar(); });

  /* ── FILE UPLOAD ── */
  const IMAGE_TYPES = ['image/jpeg','image/png','image/gif','image/webp'];
  const MAX_SIZE_MB = 10;

  function formatBytes(b) {
    if (b < 1024) return b+' B';
    if (b < 1048576) return (b/1024).toFixed(1)+' KB';
    return (b/1048576).toFixed(1)+' MB';
  }
  function docIcon(name) {
    const ext = name.split('.').pop().toLowerCase();
    return {pdf:'📄',doc:'📝',docx:'📝',txt:'📃',csv:'📊',xlsx:'📊',xls:'📊'}[ext] || '📎';
  }

  uploadBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0]; if (!file) return;
    fileInput.value = '';
    if (file.size > MAX_SIZE_MB * 1024 * 1024) { showToast(`Max ${MAX_SIZE_MB}MB allowed.`,'error'); return; }
    const isImage = IMAGE_TYPES.includes(file.type);
    const base64  = await new Promise((res,rej) => {
      const r = new FileReader();
      r.onload  = () => res(r.result.split(',')[1]);
      r.onerror = () => rej();
      r.readAsDataURL(file);
    });
    STATE.pendingFile = { file, base64, isImage, mimeType: file.type };
    filePreviewThumb.innerHTML = isImage
      ? `<img class="file-preview-thumb" src="data:${file.type};base64,${base64}" alt="preview">`
      : `<div class="file-preview-doc-icon">${docIcon(file.name)}</div>`;
    filePreviewName.textContent = file.name;
    filePreviewMeta.textContent = `${formatBytes(file.size)} · ${isImage ? 'Image' : 'Document'}`;
    filePreviewBar.classList.add('visible');
    uploadBtn.classList.add('has-file');
  });
  fileRemoveBtn.addEventListener('click', clearPendingFile);
  function clearPendingFile() {
    STATE.pendingFile = null;
    filePreviewBar.classList.remove('visible');
    filePreviewThumb.innerHTML = '';
    filePreviewName.textContent = '';
    filePreviewMeta.textContent = '';
    uploadBtn.classList.remove('has-file');
  }

  /* ── TOAST ── */
  let toastTimer;
  function showToast(msg, type='') {
    toastEl.textContent = msg;
    toastEl.className   = 'toast show '+type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = 'toast'; }, 3200);
  }

  /* ── AUTH UI ── */
  function updateAuthUI() {
    if (STATE.token && STATE.email) {
      userNameEl.textContent = STATE.email;
      userRoleEl.textContent = 'Signed in';
      avatarEl.textContent   = STATE.email[0].toUpperCase();
      topAuthBtn.textContent = 'Sign out';
    } else {
      userNameEl.textContent = 'Guest User';
      userRoleEl.textContent = 'Click to sign in';
      avatarEl.textContent   = 'SG';
      topAuthBtn.textContent = 'Sign in';
    }
  }

  /* ── MODAL ── */
  function openModal()  { modal.classList.add('open'); modalError.classList.remove('show'); emailInput.value=''; passwordInput.value=''; setTimeout(()=>emailInput.focus(),80); }
  function closeModal() { modal.classList.remove('open'); }
  function setModalError(msg) { modalError.textContent=msg; modalError.classList.add('show'); }

  function setTab(isLogin) {
    STATE.isLogin = isLogin;
    document.getElementById('tabLogin').classList.toggle('active', isLogin);
    document.getElementById('tabSignup').classList.toggle('active', !isLogin);
    document.getElementById('modalTitle').textContent    = isLogin ? 'Welcome back'     : 'Create account';
    document.getElementById('modalSubtitle').textContent = isLogin ? 'Sign in to chat with SG AI' : 'Join SG ChatBOT today';
    submitBtn.textContent = isLogin ? 'Sign in' : 'Create account';
    modalError.classList.remove('show');
  }

  async function handleSubmit() {
    const email = emailInput.value.trim(), password = passwordInput.value;
    if (!email || !password) { setModalError('Please fill in all fields.'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setModalError('Invalid email format.'); return; }
    if (password.length < 8) { setModalError('Password must be at least 8 characters.'); return; }
    submitBtn.disabled = true;
    submitBtn.textContent = STATE.isLogin ? 'Signing in…' : 'Creating account…';
    modalError.classList.remove('show');
    try {
      const res  = await fetch(STATE.isLogin ? `${API}/login` : `${API}/signup`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) { setModalError(data.message || 'Something went wrong.'); return; }
      if (STATE.isLogin) {
        STATE.token = data.token; STATE.email = data.email || email;
        localStorage.setItem('sg_token', STATE.token);
        localStorage.setItem('sg_email', STATE.email);
        updateAuthUI(); closeModal(); showToast('Signed in ✓','success');
      } else {
        showToast('Account created! Please sign in.','success'); setTab(true);
      }
    } catch { setModalError('Network error. Is the server running?'); }
    finally { submitBtn.disabled=false; submitBtn.textContent = STATE.isLogin ? 'Sign in' : 'Create account'; }
  }

  function signOut() {
    STATE.token=null; STATE.email=null;
    localStorage.removeItem('sg_token'); localStorage.removeItem('sg_email');
    updateAuthUI(); showToast('Signed out');
  }

  /* ── RENDER ── */
  function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function hideWelcome() {
    if (!STATE.welcomeVisible) return;
    document.getElementById('welcome')?.remove();
    STATE.welcomeVisible = false;
  }

  function botAvatarHtml(thinking=false) {
    return `<div class="bot-avatar-wrap${thinking?' thinking':''}"><div class="bot-avatar-bg">✦</div><div class="bot-avatar-ring"></div></div>`;
  }

  function renderUserMessage(text, file) {
    hideWelcome();
    const row = document.createElement('div');
    row.className = 'msg-row user';
    let content = '';
    if (file) {
      if (file.isImage) {
        content += `<div class="msg-file-preview"><img src="data:${file.mimeType};base64,${file.base64}" alt="uploaded"></div>`;
      } else {
        content += `<div class="msg-doc-preview"><div class="doc-icon">${docIcon(file.file.name)}</div><div class="doc-info"><div class="doc-name">${escapeHtml(file.file.name)}</div><div class="doc-size">${formatBytes(file.file.size)}</div></div></div>`;
      }
    }
    if (text) content += `<div class="bubble">${escapeHtml(text)}</div>`;
    row.innerHTML = content;
    chatEl.appendChild(row);
    chatEl.scrollTo({ top: chatEl.scrollHeight, behavior:'smooth' });
  }

  function renderTyping() {
    const row = document.createElement('div');
    row.className='msg-row bot'; row.id='typing-row';
    row.innerHTML = botAvatarHtml(false) + `
      <div class="bubble">
        <div class="typing-indicator">
          <div class="typing-bar"></div>
          <div class="typing-bar"></div>
          <div class="typing-bar"></div>
          <div class="typing-bar"></div>
          <div class="typing-bar"></div>
          <span class="typing-label">Thinking…</span>
        </div>
      </div>`;
    chatEl.appendChild(row);
    requestAnimationFrame(() => requestAnimationFrame(() => { row.querySelector('.bot-avatar-wrap')?.classList.add('thinking'); }));
    chatEl.scrollTo({ top: chatEl.scrollHeight, behavior:'smooth' });
    return row;
  }

  function addCopyButtons(el) {
    el.querySelectorAll('pre').forEach(pre => {
      if (pre.querySelector('.copy-btn')) return;
      const btn = document.createElement('button');
      btn.className='copy-btn'; btn.textContent='Copy';
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(pre.querySelector('code')?.textContent || pre.textContent);
        btn.textContent='Copied!';
        setTimeout(() => btn.textContent='Copy', 2000);
      });
      pre.style.position='relative';
      pre.appendChild(btn);
    });
  }

  function renderBotMessage(text) {
    const row = document.createElement('div');
    row.className='msg-row bot';
    const bubble = document.createElement('div');
    bubble.className='bubble';
    bubble.innerHTML = marked.parse(text);
    row.innerHTML = botAvatarHtml(false);
    row.appendChild(bubble);

    // ── Action buttons ──
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    actions.innerHTML = `
      <button class="msg-action-btn" title="Copy" data-action="copy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </button>
      <button class="msg-action-btn" title="Good response" data-action="like">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
        </svg>
      </button>
      <button class="msg-action-btn" title="Bad response" data-action="dislike">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/><path d="M17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/>
        </svg>
      </button>
      <button class="msg-action-btn" title="Regenerate" data-action="regenerate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.84"/>
        </svg>
      </button>`;

    // Button events
    actions.querySelector('[data-action="copy"]').addEventListener('click', function() {
      navigator.clipboard.writeText(text);
      this.classList.add('copied');
      showToast('Copied!', 'success');
      setTimeout(() => this.classList.remove('copied'), 2000);
    });

    actions.querySelector('[data-action="like"]').addEventListener('click', function() {
      this.classList.toggle('liked');
      actions.querySelector('[data-action="dislike"]').classList.remove('disliked');
      showToast(this.classList.contains('liked') ? '👍 Marked as helpful' : 'Removed', '');
    });

    actions.querySelector('[data-action="dislike"]').addEventListener('click', function() {
      this.classList.toggle('disliked');
      actions.querySelector('[data-action="like"]').classList.remove('liked');
      showToast(this.classList.contains('disliked') ? '👎 Marked as unhelpful' : 'Removed', '');
    });

    actions.querySelector('[data-action="regenerate"]').addEventListener('click', async function() {
      // Remove last assistant message from memory and resend
      const lastUserIdx = [...STATE.memory].reverse().findIndex(m => m.role === 'user');
      if (lastUserIdx === -1) return;
      const idx = STATE.memory.length - 1 - lastUserIdx;
      STATE.memory = STATE.memory.slice(0, idx + 1);
      row.remove();
      const typingRow = renderTyping();
      try {
        const formData = new FormData();
        formData.append('messages', JSON.stringify(STATE.memory));
        const res  = await fetch(`${API}/chat`, { method:'POST', headers:{'Authorization':`Bearer ${STATE.token}`}, body: formData });
        const data = await res.json();
        typingRow.remove();
        renderBotMessage(data.reply || 'No response.');
      } catch {
        typingRow.remove();
        renderBotMessage('⚠️ **Connection error.** Please try again.');
      }
    });

    row.appendChild(actions);
    chatEl.appendChild(row);
    STATE.memory.push({ role:'assistant', content:text });

    // ── Typewriter effect ──
    bubble.innerHTML = '';
    const cursor = document.createElement('span');
    cursor.className = 'typewriter-cursor';
    bubble.appendChild(cursor);

    const fullHtml = marked.parse(text);
    const tempDiv  = document.createElement('div');
    tempDiv.innerHTML = fullHtml;
    const plainText = tempDiv.textContent || tempDiv.innerText || '';

    // For short text: char by char. For long: word by word (faster)
    const words     = plainText.split('');
    const isLong    = plainText.length > 300;
    const chunks    = isLong ? plainText.split(/(\s+)/) : words;
    let   i         = 0;
    let   displayed = '';

    const speed = isLong ? 8 : 18; // ms per chunk

    function typeNext() {
      if (i < chunks.length) {
        displayed += chunks[i];
        i++;
        // Re-render markdown progressively every ~10 chunks for performance
        if (i % 10 === 0 || i === chunks.length) {
          bubble.innerHTML = marked.parse(displayed) + '<span class="typewriter-cursor"></span>';
          addCopyButtons(bubble);
        } else {
          // Fast path: just append text node
          const cursorEl = bubble.querySelector('.typewriter-cursor');
          if (cursorEl) cursorEl.before(document.createTextNode(chunks[i-1]));
        }
        chatEl.scrollTo({ top: chatEl.scrollHeight, behavior:'smooth' });
        setTimeout(typeNext, speed);
      } else {
        // Typing done — render final markdown properly
        bubble.innerHTML = marked.parse(text);
        addCopyButtons(bubble);
        if (window.renderMathInElement) renderMathInElement(bubble, { delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false });
        chatEl.scrollTo({ top: chatEl.scrollHeight, behavior:'smooth' });
      }
    }
    setTimeout(typeNext, 60);

    const lastUser = STATE.memory.slice().reverse().find(m=>m.role==='user');
    addToHistory(lastUser ? lastUser.content : 'Chat');
  }

  function addToHistory(content) {
    if (STATE.historyAdded) return; // ✅ already added, skip
    STATE.historyAdded = true;

    let text = typeof content === 'string' ? content : (content.find?.(p=>p.type==='text')?.text || '📎 File');
    if (!text) text = '📎 File';
    const label = text.slice(0,36) + (text.length>36?'…':'');
    const hist  = document.getElementById('history');
    hist.querySelectorAll('.history-item').forEach(i=>i.classList.remove('active'));
    const item  = document.createElement('div');
    item.className='history-item active';
    item.textContent=label;
    hist.prepend(item);
  }

  /* ── SEND ── */
  function checkTriggers(text) {
    const lower = text.toLowerCase();
    for (const [key, phrases] of Object.entries(TRIGGERS)) {
      if (phrases.some(p=>lower.includes(p))) { renderBotMessage(TRIGGER_REPLIES[key]); return true; }
    }
    return false;
  }

  async function send() {
    const text = inputEl.value.trim();
    const file = STATE.pendingFile;
    if (!text && !file) return;
    if (!STATE.token) { showToast('Please sign in to chat','error'); openModal(); return; }

    inputEl.value=''; inputEl.style.height='auto';
    renderUserMessage(text, file);
    clearPendingFile();

    if (text && checkTriggers(text)) return;

    // Build user content for memory
    let userContent;
    if (file) {
      const parts = [];
      if (file.isImage) {
        parts.push({ type:'image_url', image_url:{ url:`data:${file.mimeType};base64,${file.base64}` } });
        parts.push({ type:'text', text: text || 'Please analyze this image and describe what you see.' });
      } else {
        parts.push({ type:'text', text: text ? `[Attached: ${file.file.name}]\n\n${text}` : `[Attached: ${file.file.name}]\n\nPlease describe this document.` });
      }
      userContent = parts.length===1 ? parts[0].text : parts;
    } else {
      userContent = text;
    }

    STATE.memory.push({ role:'user', content: userContent });

    const sendBtn = document.getElementById('sendBtn');
    sendBtn.classList.add('loading');

    const typingRow = renderTyping();

    try {
      const formData = new FormData();
      formData.append('messages', JSON.stringify(STATE.memory));
      if (file) {
        formData.append('file',     file.file);
        formData.append('fileType', file.isImage ? 'image' : 'document');
      }

      const res  = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${STATE.token}` },
        body: formData,
      });
      const data = await res.json();
      typingRow.remove();
      sendBtn.classList.remove('loading');
      if (res.status===401) { signOut(); showToast('Session expired. Please sign in again.','error'); openModal(); return; }
      renderBotMessage(data.reply || 'No response.');
    } catch {
      typingRow.remove();
      sendBtn.classList.remove('loading');
      renderBotMessage('⚠️ **Connection error.** Please check your server or try again.');
    }
  }

  function clearChat() {
    STATE.memory=[]; STATE.historyAdded=false; clearPendingFile();
    chatEl.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-icon">✦</div>
        <h1>How can I help you?</h1>
        <p>Ask anything — powered by SG AI</p>
        <div class="suggestion-grid">
          <button class="suggestion-card" data-prompt="Explain quantum computing in simple terms"><strong>Explain a concept</strong>Quantum computing, simplified</button>
          <button class="suggestion-card" data-prompt="Write a Python function to sort a list of dictionaries by a key"><strong>Write some code</strong>Sort a list in Python</button>
          <button class="suggestion-card" data-prompt="What are the best productivity habits for developers?"><strong>Give me advice</strong>Developer productivity tips</button>
          <button class="suggestion-card" data-prompt="Summarize the key differences between REST and GraphQL"><strong>Compare ideas</strong>REST vs. GraphQL</button>
        </div>
      </div>`;
    STATE.welcomeVisible=true;
    bindSuggestions();
  }

  function bindSuggestions() {
    document.querySelectorAll('.suggestion-card').forEach(card=>{
      card.addEventListener('click', ()=>{
        if (!STATE.token) { showToast('Please sign in to chat','error'); openModal(); return; }
        inputEl.value=card.dataset.prompt; send();
      });
    });
  }

  /* ── EVENTS ── */
  document.getElementById('sendBtn').addEventListener('click', send);
  document.getElementById('clearBtn').addEventListener('click', clearChat);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('submitBtn').addEventListener('click', handleSubmit);
  document.getElementById('tabLogin').addEventListener('click', ()=>setTab(true));
  document.getElementById('tabSignup').addEventListener('click', ()=>setTab(false));
  document.getElementById('sidebarUserBtn').addEventListener('click', ()=>STATE.token ? signOut() : openModal());
  topAuthBtn.addEventListener('click', ()=>STATE.token ? signOut() : openModal());
  modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });
  inputEl.addEventListener('input', function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,140)+'px'; });
  inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
  emailInput.addEventListener('keydown',    e=>{ if(e.key==='Enter') passwordInput.focus(); });
  passwordInput.addEventListener('keydown', e=>{ if(e.key==='Enter') handleSubmit(); });
  document.addEventListener('keydown',      e=>{ if(e.key==='Escape') closeModal(); });

  // Drag & drop
  const inputArea = document.querySelector('.input-area');
  inputArea.addEventListener('dragover',  e=>{ e.preventDefault(); inputArea.style.outline='2px dashed var(--accent)'; });
  inputArea.addEventListener('dragleave', ()=>{ inputArea.style.outline=''; });
  inputArea.addEventListener('drop', e=>{
    e.preventDefault(); inputArea.style.outline='';
    const file=e.dataTransfer.files[0];
    if(file){ const dt=new DataTransfer(); dt.items.add(file); fileInput.files=dt.files; fileInput.dispatchEvent(new Event('change')); }
  });

  updateAuthUI();
  bindSuggestions();
</script>
</body>
</html>
